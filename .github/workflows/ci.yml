name: CI

# Runs the whole test suite automatically instead of relying on someone
# remembering to. `unit` needs no secrets (lint/typecheck/vitest are all pure
# — no network, no DB) so it always runs. `integration`, `cache-roundtrip`,
# `form-roundtrip`, `admin-write` and `e2e` each need their own Supabase
# project (see the `env:` block in each job for exactly which repo secrets to
# add, Settings → Secrets and variables → Actions, before they can pass) —
# `integration`, `cache-roundtrip`, `form-roundtrip` and `admin-write` all
# write to and delete from the SAME dedicated, disposable test project (see
# README "Integration tests"), `e2e` only reads from the real one.
#
# Every job below sets timeout-minutes, well above its normal run time (a
# few minutes) but far under GitHub's 360-minute default — nothing should
# silently eat a runner-hour (or make cancelling it someone's job to
# notice) if something does hang.
#
# `form-roundtrip`, `admin-write` and `e2e` all drive a real browser, and
# used to run `npx playwright install --with-deps chromium` on the bare
# runner. That repeatedly hung for 20+ minutes, then 1+ hour, then hit the
# 15-minute timeout outright, always stuck in `apt-get update` endlessly
# retrying an unreachable azure.archive.ubuntu.com mirror before falling
# back to the real one — a GitHub-hosted-runner networking flake. They now
# run inside Playwright's own Docker image (browsers + OS deps
# preinstalled, version-matched to package.json's @playwright/test), so no
# apt-get ever runs in CI and that mirror can't be hit. Keep the image tag
# in sync with @playwright/test's version in package.json.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (real Supabase reads/writes)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  cache-roundtrip:
    name: Cache round-trip (admin save reaches the cached page)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No browser install — this suite only makes raw HTTP calls via
      # Playwright's `request` fixture, never launches a browser.
      - run: npm run test:cache-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cache
          path: playwright-report-cache/
          retention-days: 14

  form-roundtrip:
    name: Form submission (wizard reaches the database)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unlike cache-roundtrip, this suite drives a real browser (filling in
      # and submitting the wizard). Browsers + OS deps are already in the
      # container image, so no `playwright install` step is needed here.
      - run: npm run test:form-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-form
          path: playwright-report-form/
          retention-days: 14

  admin-write:
    name: Admin console write behavior (approve/reject via the real UI)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Drives a real browser (clicking Approve/Reject in ModerationQueue),
      # same as form-roundtrip — no `playwright install` step needed, see
      # container image above.
      - run: npm run test:admin-write
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-admin-write
          path: playwright-report-admin-write/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the two engines the config actually uses (Desktop Chrome + Pixel 7
      # device emulation are both Chromium) — no `playwright install` step
      # needed, see container image above. It ships every engine, but we
      # only invoke Chromium via test:e2e.
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
